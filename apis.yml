name: AMP Robotics
description: 'AMP Robotics (operating as AMP Sortation) is an artificial-intelligence
  company for the waste and recycling industry that designs, builds, and operates
  advanced, cost-competitive facilities to process single-stream recycling and municipal
  solid waste. Its Smart Sortation technology suite combines computer vision (real-time
  material characterization), high-speed air-jet sortation (Jet and MicroJet), and
  robotic-arm sortation (Delta) to raise material-recovery rates, cut contamination,
  and extend landfill life. The flagship AMP ONE platform delivers fully automated,
  facility-scale sortation processing from 10K to 1M+ tons annually for waste haulers,
  material-recovery facilities, and municipalities. AMP Robotics is a Google Ventures
  (GV) portfolio company. No public developer API, API documentation, or developer
  portal is published; this profile is maintained for network discovery and identity.'
